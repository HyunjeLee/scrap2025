# This is a basic workflow to help you get started with Actions

name: Android CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main", "develop", "release/*" ]
  pull_request:
    branches: [ "main", "develop", "release/*" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    steps:
    # 소스 코드 가져오기
    - name: Checkout Code
      uses: actions/checkout@v4

    # GitHub Secrets를 사용하여 local.properties 파일 생성
    - name: Create local.properties
      run: echo "${{ secrets.LOCAL_PROPERTIES }}" > local.properties

    # 시크릿에 넣어둔 Base64 텍스트를 이용해 실제 파일을 만듭니다.
    - name: Decode Keystore
      run: | 
        echo -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > release-key.jks

    # local.properties에 파일의 위치를 알려줍니다.
    # (위에서 프로젝트 루트에 파일을 만들었으니 ../release-key.jks 같은 식으로 경로 설정)
    - name: Update STORE_FILE Path
      run: |
        echo "STORE_FILE=release-key.jks" >> local.properties
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle # Gradle 캐시를 사용하여 속도 향상
        
    # Gradle 실행 권한 부여
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    # Lint 검사 (코드 스타일 및 잠재적 버그 확인)
    - name: Run Lint
      run: ./gradlew lintDevDebug
      
    # 유닛 테스트 실행
    - name: Run Unit Tests
      run: ./gradlew testDevDebugUnitTest
      
    # 빌드 확인 (컴파일 에러가 없는지 최종 확인)
    - name: Build Debug APK
      run: ./gradlew assembleDevDebug

    # 출시 준비(Release)나 메인(Main) 브랜치인 경우 운영용(Prod) 빌드도 검증 추가
    # (조건문: github.ref가 main이거나 release/로 시작할 때)
    - name: Build Prod Release APK
      if: contains(github.ref, 'main') || contains(github.ref, 'release/')
      run: ./gradlew bundleProdRelease
