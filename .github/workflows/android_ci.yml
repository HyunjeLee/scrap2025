# This is a basic workflow to help you get started with Actions

name: Android CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    steps:
    # 1. 소스 코드 가져오기
    - name: Checkout Code
      uses: actions/checkout@v4

    # GitHub Secrets를 사용하여 local.properties 파일 생성
    - name: Create local.properties
      run: echo "${{ secrets.LOCAL_PROPERTIES }}" > local.properties
    # google-services.json 생성
    # - name: Create google-services.json
    #  run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json

      
    # 2. 자바 환경 설정 (프로젝트의 JDK 버전에 맞게 수정하세요)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle # Gradle 캐시를 사용하여 속도 향상
        
    # 3. Gradle 실행 권한 부여
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    # 4. Lint 검사 (코드 스타일 및 잠재적 버그 확인)
    - name: Run Lint
      run: ./gradlew lintDebug
      
    # 5. 유닛 테스트 실행
    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest
      
    # 6. 빌드 확인 (컴파일 에러가 없는지 최종 확인)
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # 7. 결과 보고서 저장
    - name: Upload Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Android-CI-Results
        path: |
          app/build/reports/lint-results-debug.html
          app/build/test-results/testDebugUnitTest/
