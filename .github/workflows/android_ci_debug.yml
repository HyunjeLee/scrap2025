name: Android CI Debug

on:
  push:
    branches: [ "develop" ]

  pull_request:
    branches: [ "main", "develop", "release/*" ]

  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Create local.properties
      run: |
        echo "${{ secrets.NAVER_SECRET }}" > local.properties
        echo "${{ secrets.KAKAO_SECRET }}" >> local.properties
        echo "${{ secrets.RELEASE_SECRET }}" >> local.properties

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Ktlint Check
      run: ./gradlew ktlintCheck

    - name: Run Lint
      run: ./gradlew lintDevDebug

    - name: Run Unit Tests
      run: ./gradlew testDevDebugUnitTest

    - name: Build Debug APK
      run: ./gradlew assembleDevDebug

    # Firebase App Distribution
    # debug CI지만 devDebug가 아닌 devRelease 빌드로 배포한다.
    # debug 빌드는 runner마다 새로 생성되는 debug keystore로 서명되어 빌드마다 서명이 달라지므로,
    # 업로드 키로 서명된 release 빌드를 배포해 테스터에게 항상 같은 서명 키의 APK를 제공한다. (업데이트 설치 가능)
    - name: Create Firebase service account file
      if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
      run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > "$RUNNER_TEMP/firebase-sa.json"

    - name: Distribute Dev Release APK
      if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
      env:
        GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
      run: |
        ./gradlew assembleDevRelease appDistributionUploadDevRelease \
          --releaseNotes="develop @ ${GITHUB_SHA::7}"
