name: Android CI Release

on:
  push:
    branches: [ "main", "release/*", "hotfix/*" ]

  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create local.properties
        run: |
          echo "${{ secrets.NAVER_SECRET }}" > local.properties
          echo "${{ secrets.KAKAO_SECRET }}" >> local.properties
          echo "${{ secrets.RELEASE_SECRET }}" >> local.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Prod Release Bundle
        run: ./gradlew bundleProdRelease

      - name: Upload Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-prod-release
          path: app/build/outputs/bundle/prodRelease/app-prod-release.aab
          retention-days: 7

      - name: Upload to Google Play
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.scrap2025.scrap2025
          releaseFiles: app/build/outputs/bundle/prodRelease/app-prod-release.aab
          track: internal
          status: completed
          changesNotSentForReview: true